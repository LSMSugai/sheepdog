url: https://provetelab.org/sheepdog/

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    primary: "#241042"

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

home:
  sidebar:
    structure: [links, license, citation, authors, dev]

reference:
  - title: Stage 1 - Validation data
    desc: |
      Read BirdNET selection tables, select clips for manual review, and cut and pack them. Each sampling design sends a different part of the night to review; later rounds leave out what was reviewed.

      ![The same night of twelve recordings under the three sampling designs of select_clips().](../figures/schematic_selection.png)

      ![Review rounds: what was reviewed leaves the pool, and combine_rounds() gives one simple random sample.](../figures/schematic_rounds.png)
    contents:
      - extract_validation_clips
      - read_selection_tables
      - list_recordings
      - select_clips
      - covariate_bins
      - cut_clips
      - pack_clips
  - title: Stage 1 - Review app
    desc: |
      Review the clips in a local app and read its verdicts.

      ![Review: each clip is heard and gets one verdict.](../figures/schematic_review.png)
    contents:
      - run_app
      - app_verdicts
  - title: Stage 1 - Several reviewers
    desc: |
      Split the clips among reviewers, measure their agreement and combine their verdicts.

      ![Several reviewers: a share of the clips goes to both, which gives their agreement.](../figures/schematic_reviewers.png)
    contents:
      - assign_reviewers
      - split_by_reviewer
      - reviewer_agreement
      - consensus_verdicts
  - title: Stage 1 - After the review
    desc: |
      Classify the reviewed clips and summarise precision, thresholds, presence and retraining clips. The [diagnostic diagram](../figures/stage1_diagnostic.png) shows what to do with each label of `review_support()`, and how to compare the empirical and model-based thresholds.

      ![The two thresholds on simulated data: the precision above each cut, where each curve reaches p_min, the choice of model and the comparison.](../figures/thresholds.png)

      ![The retraining loop, for when the classifier and not the review limits precision.](../figures/schematic_retraining.png)
    contents:
      - post_validation
      - classify_review
      - precision_by_bin
      - suggest_thresholds
      - review_support
      - nightly_presence
      - retraining_clips
      - plot_precision
      - read_validation_tables
      - combine_rounds
      - build_training_set
      - exclude_training_clips
      - training_nights
  - title: Stage 2 - Calibration
    desc: |
      Calibrate confidence scores into probabilities of true detection and build nightly detection histories. The [calibration diagram](../figures/stage2_calibration.png) has the steps and checks in order.

      ![The reviewed clips give the curve, and every detection gets its P(tp).](../figures/schematic_curve.png)

      ![The detections of a night become one cell of the nightly history.](../figures/schematic_nights.png)
    contents:
      - calibrate
      - read_validations
      - calibration_models
      - calibration_folds
      - compare_calibration_models
      - select_calibration_model
      - calibration_quality
      - fit_calibration
      - calibration_effort
      - score_detections
      - calibrated_thresholds
      - compare_thresholds
      - detection_history
      - threshold_history
      - summarise_history
      - plot_calibration
  - title: Stage 2 - Bayesian calibration
    desc: |
      Fit the calibration with brms, check the prior and the fit, and propagate the uncertainty to the histories and the matrices.

      ![The posterior of P(tp) gives one history per draw, and a mean and an interval per cell of the matrices.](../figures/schematic_draws.png)
    contents:
      - calibration_prior
      - prior_predictive_calibration
      - calibration_diagnostics
      - calibration_sensitivity
      - plot_calibration_draws
      - calibration_ppc
      - plot_calibration_ppc
      - history_draws
      - occasion_draws
      - community_matrices_draws
  - title: Stage 3 - Community matrices
    desc: |
      Effort-standardised site x month matrices from calibrated histories. The [diagram](../figures/stage3_community.png) also shows the occupancy export.

      ![From the nightly history to the matrices and their analysis.](../figures/schematic_matrix.png)
    contents:
      - build_community_matrices
      - community_matrices
      - cell_status
      - suggest_core_species
  - title: Occupancy models
    desc: Export the occasions, scores, reviewed clips and calibration draws for occupancy models with false positives, such as those of crywolf.
    contents:
      - export_occupancy_data
  - title: Package
    contents:
      - sheepdog-package

